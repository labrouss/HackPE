<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HackPE Config Compare - match two OpenCore config.plist files</title>
    <meta name="description" content="Compare two OpenCore config.plist files in your browser: every important difference explained, health checks, and a step-by-step plan to make one config match the other." />
    <script>
      // pick the theme before the first paint: saved choice, else the system setting
      (function () {
        var t = null;
        try { t = localStorage.getItem('hackpe-theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
