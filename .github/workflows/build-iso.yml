name: Build HackPE ISO

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
  schedule:
    - cron: '17 3 * * 1'          # weekly: rebuild with the newest components, publish only if something changed
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish the ISO as a GitHub release'
        type: boolean
        default: false
      python_version:
        description: 'Embeddable Python bundled in WinPE (latest = newest stable with a Windows embed build)'
        default: 'latest'

permissions:
  contents: write                  # needed to create releases

concurrency:
  group: hackpe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------------
  test:
    name: Lint + EFI regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Toolchain (MinGW-w64, bison, flex, iasl)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends gcc-mingw-w64-x86-64 bison flex acpica-tools

      - name: Build 64-bit iasl.exe + acpidump.exe from the latest ACPICA release (WinPE has no WOW64)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(gh api repos/acpica/acpica/releases/latest --jq .tag_name 2>/dev/null || true)
          echo "Latest ACPICA release: ${TAG:-<unknown, using default branch>}"
          bash build/build-acpica-win64.sh "$TAG" acpica-win64
          file acpica-win64/*.exe | grep -q 'PE32+' || { echo "not x64"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: acpica-win64
          path: acpica-win64/

      - name: Python lint
        run: |
          pip install pyflakes
          python -m pyflakes engine tests

      - name: PowerShell syntax check
        shell: pwsh
        run: |
          $bad = 0
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $e = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$e)
            foreach ($x in $e) { Write-Host "::error file=$($_.FullName),line=$($x.Extent.StartLineNumber)::$($x.Message)"; $bad++ }
          }
          exit $bad

      - name: Build EFIs for test hardware + ocvalidate + SSDT auto-generation on real ACPI tables
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/acpi"
          for t in /sys/firmware/acpi/tables/*; do [ -f "$t" ] && sudo cp "$t" "$RUNNER_TEMP/acpi/$(basename "$t").aml" || true; done
          sudo chmod a+r "$RUNNER_TEMP"/acpi/*
          ls "$RUNNER_TEMP/acpi"
          python tests/run_tests.py --tables "$RUNNER_TEMP/acpi" --iasl "$(command -v iasl)"

  # --------------------------------------------------------------------------
  iso:
    name: Build WinPE ISO
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0                          # full history + tags for the changelog

      - uses: actions/download-artifact@v4
        with:
          name: acpica-win64
          path: ${{ runner.temp }}\acpica-win64

      - name: Version
        id: ver
        shell: pwsh
        run: |
          if ('${{ github.ref_type }}' -eq 'tag') { $v = '${{ github.ref_name }}' }
          else { $v = "$(Get-Date -Format 'yyyy.MM.dd')-$('${{ github.sha }}'.Substring(0, 7))" }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "HackPE version $v"

      - name: Install Windows ADK + WinPE add-on
        shell: powershell
        run: |
          $ocs = "${env:ProgramFiles(x86)}\Windows Kits\10\Assessment and Deployment Kit\Windows Preinstallation Environment\amd64\WinPE_OCs"
          if (Test-Path $ocs) { Write-Host 'ADK + WinPE already installed'; exit 0 }
          # ADK 10.1.26100.x (Windows 11 24H2/25H2) - links from learn.microsoft.com/windows-hardware/get-started/adk-install
          curl.exe -sSL -o "$env:RUNNER_TEMP\adksetup.exe"      'https://go.microsoft.com/fwlink/?linkid=2289980'
          curl.exe -sSL -o "$env:RUNNER_TEMP\adkwinpesetup.exe" 'https://go.microsoft.com/fwlink/?linkid=2289981'
          $p = Start-Process "$env:RUNNER_TEMP\adksetup.exe" -Wait -PassThru `
                 -ArgumentList '/quiet /norestart /ceip off /features OptionId.DeploymentTools'
          if ($p.ExitCode -ne 0) { throw "adksetup failed: $($p.ExitCode)" }
          $p = Start-Process "$env:RUNNER_TEMP\adkwinpesetup.exe" -Wait -PassThru `
                 -ArgumentList '/quiet /norestart /ceip off /features OptionId.WindowsPreinstallationEnvironment'
          if ($p.ExitCode -ne 0) { throw "adkwinpesetup failed: $($p.ExitCode)" }
          if (-not (Test-Path $ocs)) { throw 'WinPE optional components not found after install' }
          Write-Host 'ADK installed'

      - name: Build HackPE
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}     # 1000 GitHub API calls/h instead of 60
          PYVER: ${{ inputs.python_version || 'latest' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $out = "$env:RUNNER_TEMP\out"; New-Item -ItemType Directory -Force $out | Out-Null
          $iso = Join-Path $out 'HackPE-${{ steps.ver.outputs.version }}.iso'
          $params = @{
            WorkDir       = "$env:RUNNER_TEMP\build"
            IsoPath       = $iso
            Version       = '${{ steps.ver.outputs.version }}'
            PythonVersion = $env:PYVER
            AcpicaDir     = "$env:RUNNER_TEMP\acpica-win64"
          }
          if (Get-ChildItem drivers -Recurse -Filter *.inf -ErrorAction SilentlyContinue) {
            $params.DriversPath = (Resolve-Path drivers).Path
            Write-Host 'Injecting drivers from ./drivers'
          }
          .\Build-HackPE.ps1 @params
          Compress-Archive "$env:RUNNER_TEMP\acpica-win64\*" (Join-Path $out 'acpica-win64.zip') -Force
          Copy-Item "$env:RUNNER_TEMP\build\versions.json" (Join-Path $out 'versions.json') -Force
          $hash = (Get-FileHash $iso -Algorithm SHA256).Hash.ToLower()
          "$hash  $(Split-Path $iso -Leaf)" | Set-Content -Encoding ascii "$iso.sha256"

      - name: Job summary
        if: always()
        shell: powershell
        run: |
          $py = "$env:RUNNER_TEMP\build\stage\HackPE\python\python.exe"
          $st = if (Test-Path $py) { & $py "$env:RUNNER_TEMP\build\stage\HackPE\engine\hackpe.py" --cache "$env:RUNNER_TEMP\build\cache" status | Out-String } else { 'build did not get far enough' }
          $iso = Get-ChildItem "$env:RUNNER_TEMP\out\*.iso" -ErrorAction SilentlyContinue | Select-Object -First 1
          $size = if ($iso) { '{0:N0} MB' -f ($iso.Length / 1MB) } else { 'n/a' }
          @"
          ## HackPE ${{ steps.ver.outputs.version }}
          ISO size: **$size**

          ``````
          $st
          ``````
          "@ | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY

      - name: Release notes (component versions vs previous release + commits)
        id: notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          $out = "$env:RUNNER_TEMP\out"
          $prev = gh release list --limit 30 --json tagName,createdAt --jq '.[].tagName' 2>$null | Where-Object { $_ -and $_ -ne $v } | Select-Object -First 1
          $prevJson = Join-Path $env:RUNNER_TEMP 'prev-versions.json'
          if ($prev) {
            gh release download $prev --pattern versions.json --output $prevJson --clobber 2>$null
            Write-Host "Previous release: $prev"
          }
          $rnArgs = @('build/release_notes.py', '--current', "$out\versions.json", '--version', $v,
                    '--sha256', (Get-ChildItem "$out\*.sha256" | Select-Object -First 1).FullName, '--out', "$env:RUNNER_TEMP\RELEASE_NOTES.md")
          if ($prev) { $rnArgs += @('--prev-tag', $prev) }
          if (Test-Path $prevJson) { $rnArgs += @('--previous', $prevJson) }
          $res = python @rnArgs
          $res | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          Get-Content "$env:RUNNER_TEMP\RELEASE_NOTES.md" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          Write-Host $res

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: HackPE-${{ steps.ver.outputs.version }}
          path: ${{ runner.temp }}\out\*
          retention-days: 7
          compression-level: 0

      - name: Publish GitHub release
        if: github.ref_type == 'tag' || inputs.publish_release || (github.event_name == 'schedule' && steps.notes.outputs.changed == 'true')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          $files = (Get-ChildItem "$env:RUNNER_TEMP\out\*").FullName
          $pre = if ('${{ github.ref_type }}' -eq 'tag') { @() } else { @('--prerelease') }
          $notes = "$env:RUNNER_TEMP\RELEASE_NOTES.md"
          gh release view $v *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $v @files --clobber
            if ($LASTEXITCODE -eq 0) { gh release edit $v --notes-file $notes }
          } else {
            gh release create $v @files --title "HackPE $v" --target '${{ github.sha }}' --notes-file $notes @pre
          }
          if ($LASTEXITCODE -ne 0) { throw 'release failed' }
